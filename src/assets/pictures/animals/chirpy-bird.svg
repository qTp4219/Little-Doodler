    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 210 160 C 160 160 160 240 210 240 C 260 240 260 160 210 160 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 210 230 C 150 250 170 380 270 370 C 370 360 410 270 330 250 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 220 370 L 220 395 M 260 370 L 260 395" />
  </g>
</svg>
