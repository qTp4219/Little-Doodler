    <path id="spot2" name="Spot 2" fill="#1E293B" d="M 320 240 C 305 240 305 270 320 270 C 335 270 335 240 320 240 Z" />
    <path id="leg_l1" name="Leg Left 1" fill="#1E293B" d="M 150 200 L 100 180 L 95 195 L 145 215 Z" />
