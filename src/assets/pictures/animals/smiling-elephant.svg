<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" data-title="Smiling Elephant" data-category="animals" data-accent="#38BDF8">
  <title>Smiling Elephant</title>
  <!-- Colorable Regions -->
  <g id="regions">
    <path id="bg" name="Background" fill="#EFF6FF" d="M 10 10 L 490 10 L 490 490 L 10 490 Z" />
    <path id="ear_l" name="Big Left Ear" fill="#93C5FD" d="M 170 150 C 70 130 60 280 180 270 Z" />
    <path id="head" name="Head" fill="#60A5FA" d="M 250 120 C 170 120 160 250 250 260 C 340 250 330 120 250 120 Z" />
    <path id="trunk" name="Lucky Upward Trunk" fill="#60A5FA" d="M 240 230 C 230 330 290 340 290 280 C 290 250 265 250 260 230 Z" />
    <path id="body" name="Body" fill="#60A5FA" d="M 250 250 C 160 250 150 400 250 410 C 350 400 340 250 250 250 Z" />
    <path id="leg_fl" name="Front Left Leg" fill="#3B82F6" d="M 180 370 L 180 450 L 215 450 L 215 390 Z" />
    <path id="leg_fr" name="Front Right Leg" fill="#3B82F6" d="M 230 380 L 230 450 L 265 450 L 265 390 Z" />
    <path id="leg_bl" name="Back Left Leg" fill="#3B82F6" d="M 280 380 L 280 450 L 315 450 L 315 380 Z" />
    <path id="leg_br" name="Back Right Leg" fill="#3B82F6" d="M 325 370 L 325 450 L 350 450 L 350 380 Z" />
    <path id="tail" name="Cute Tail" fill="#2563EB" d="M 345 320 C 380 330 380 370 360 380 Z" />
  </g>
