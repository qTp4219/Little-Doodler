  <g id="outlines">
    <path fill="#1E293B" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" d="M 215 170 C 225 170 225 185 215 185 C 205 185 205 170 215 170 Z M 285 170 C 295 170 295 185 285 185 C 275 185 275 170 285 170 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 170 150 C 70 130 60 280 180 270 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 240 230 C 230 330 290 340 290 280 C 290 250 265 250 260 230 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 120 C 170 120 160 250 250 260 C 340 250 330 120 250 120 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 250 C 160 250 150 400 250 410 C 350 400 340 250 250 250 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M 180 370 L 180 450 M 230 380 L 230 450 M 280 380 L 280 450 M 325 370 L 325 450" />
