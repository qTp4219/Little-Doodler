<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" data-title="Teddy Bear" data-category="animals" data-accent="#92400E">
  <title>Teddy Bear</title>
  <!-- Colorable Regions -->
  <g id="regions">
    <path id="bg" name="Background" fill="#FEF3C7" d="M 10 10 L 490 10 L 490 490 L 10 490 Z" />
    <path id="ear_l" name="Left Ear" fill="#B45309" d="M 170 120 C 130 110 130 180 170 180 Z" />
    <path id="ear_r" name="Right Ear" fill="#B45309" d="M 330 120 C 370 110 370 180 330 180 Z" />
    <path id="head" name="Head" fill="#D97706" d="M 250 110 C 170 110 160 220 250 240 C 340 220 330 110 250 110 Z" />
    <path id="muzzle" name="Muzzle" fill="#FDE68A" d="M 250 180 C 220 180 220 230 250 230 C 280 230 280 180 250 180 Z" />
    <path id="body" name="Body" fill="#D97706" d="M 250 240 C 170 240 160 380 250 400 C 340 380 330 240 250 240 Z" />
    <path id="belly" name="Belly" fill="#FDE68A" d="M 250 270 C 210 270 210 370 250 370 C 290 370 290 270 250 270 Z" />
    <path id="arm_l" name="Left Arm" fill="#B45309" d="M 170 260 C 120 280 120 340 160 330 Z" />
    <path id="arm_r" name="Right Arm" fill="#B45309" d="M 330 260 C 380 280 380 340 340 330 Z" />
    <path id="foot_l" name="Left Foot" fill="#B45309" d="M 200 390 C 160 400 160 450 210 440 Z" />
    <path id="foot_r" name="Right Foot" fill="#B45309" d="M 300 390 C 340 400 340 450 290 440 Z" />
  </g>
  <!-- Permanent Foreground Outlines -->
  <g id="outlines">
    <path fill="#1E293B" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" d="M 215 155 C 225 155 225 170 215 170 C 205 170 205 155 215 155 Z M 285 155 C 295 155 295 170 285 170 C 275 170 275 155 285 155 Z" />
    <path fill="#1E293B" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" d="M 250 190 C 260 190 260 205 250 205 C 240 205 240 190 250 190 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M 250 205 L 250 220 M 240 215 Q 250 225 260 215" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 110 C 170 110 160 220 250 240 C 340 220 330 110 250 110 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 240 C 170 240 160 380 250 400 C 340 380 330 240 250 240 Z" />
  </g>
