    <path id="ear_r" name="Right Ear" fill="#B45309" d="M 340 120 C 390 120 390 190 340 190 Z" />
    <path id="ear_in_r" name="Inner Ear Right" fill="#FDE68A" d="M 340 135 C 370 135 370 175 340 175 Z" />
    <path id="head" name="Head" fill="#92400E" d="M 250 90 C 170 90 160 210 250 220 C 340 210 330 90 250 90 Z" />
    <path id="face" name="Face Mask" fill="#FDE68A" d="M 250 115 C 190 115 180 205 250 210 C 320 205 310 115 250 115 Z" />
    <path id="body" name="Monkey Body" fill="#92400E" d="M 250 220 C 170 220 160 380 250 390 C 340 380 330 220 250 220 Z" />
    <path id="belly" name="Tummy" fill="#FDE68A" d="M 250 240 C 200 240 200 350 250 350 C 300 350 300 240 250 240 Z" />
    <path id="arm_l" name="Arm Left" fill="#92400E" d="M 175 240 C 120 250 120 340 180 320 C 180 300 150 280 185 260 Z" />
    <path id="arm_r" name="Arm Right" fill="#92400E" d="M 325 240 C 380 250 380 340 320 320 C 320 300 350 280 315 260 Z" />
