  <g id="outlines">
    <path fill="#1E293B" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" d="M 220 145 C 226 145 226 158 220 158 C 214 158 214 145 220 145 Z M 280 145 C 286 145 286 158 280 158 C 274 158 274 145 280 145 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 225 180 Q 250 200 275 180" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 90 C 170 90 160 210 250 220 C 340 210 330 90 250 90 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 220 C 170 220 160 380 250 390 C 340 380 330 220 250 220 Z" />
  </g>
