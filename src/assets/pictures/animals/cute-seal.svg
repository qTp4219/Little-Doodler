    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 200 160 C 140 160 140 250 200 250 C 260 250 260 160 200 160 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 190 190 C 140 210 130 380 280 380 C 390 380 430 320 410 270" />
