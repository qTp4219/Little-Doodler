    <path fill="#1E293B" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" d="M 160 230 C 168 230 168 242 160 242 C 152 242 152 230 160 230 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 160 260 Q 185 275 210 260" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 120 260 C 120 160 280 150 380 200 C 430 220 460 210 460 250 C 440 280 390 280 350 310 C 280 360 140 350 120 260 Z" />
  </g>
</svg>
