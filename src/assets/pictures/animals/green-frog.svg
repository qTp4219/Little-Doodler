    <path id="head" name="Head" fill="#4ADE80" d="M 250 160 C 150 160 120 240 140 290 C 160 340 340 340 360 290 C 380 240 350 160 250 160 Z" />
    <path id="belly" name="Belly" fill="#FEF08A" d="M 250 250 C 190 250 180 330 250 330 C 320 330 310 250 250 250 Z" />
    <path id="arm_l" name="Front Hand Left" fill="#22C55E" d="M 190 320 L 180 390 L 210 390 L 210 320 Z" />
    <path id="arm_r" name="Front Hand Right" fill="#22C55E" d="M 290 320 L 290 390 L 320 390 L 310 320 Z" />
