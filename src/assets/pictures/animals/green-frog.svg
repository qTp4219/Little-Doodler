    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 160 C 150 160 120 240 140 290 C 160 340 340 340 360 290 C 380 240 350 160 250 160 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 190 320 L 180 390 L 210 390 M 290 320 L 290 390 L 320 390" />
