<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" data-title="Garden Snail" data-category="animals" data-accent="#F59E0B">
  <title>Garden Snail</title>
  <!-- Colorable Regions -->
  <g id="regions">
    <path id="bg" name="Garden" fill="#F0FDF4" d="M 10 10 L 490 10 L 490 490 L 10 490 Z" />
    <path id="grass" name="Grass" fill="#86EFAC" d="M 10 410 L 490 410 L 490 490 L 10 490 Z" />
    <path id="shell" name="Swirl Shell" fill="#F59E0B" d="M 300 240 C 220 240 200 360 300 380 C 400 380 420 240 300 240 Z" />
    <path id="shell_in" name="Inner Swirl" fill="#FDE047" d="M 300 270 C 250 270 240 340 300 350 C 360 350 360 270 300 270 Z" />
    <path id="foot" name="Snail Body" fill="#FB923C" d="M 120 280 C 90 280 110 380 390 390 C 430 390 440 380 410 360 C 260 350 160 340 140 280 Z" />
  </g>
  <!-- Permanent Foreground Outlines -->
  <g id="outlines">
    <path fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M 125 240 L 125 210 M 145 245 L 155 215" />
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 300 240 C 220 240 200 360 300 380 C 400 380 420 240 300 240 Z" />
  </g>
</svg>
