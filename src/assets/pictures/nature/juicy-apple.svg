<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" data-title="Sweet Apple" data-category="nature" data-accent="#EF4444">
  <title>Sweet Apple</title>
  <!-- Colorable Regions -->
  <g id="regions">
    <path id="bg" name="Kitchen Wall" fill="#FEF2F2" d="M 10 10 L 490 10 L 490 490 L 10 490 Z" />
    <path id="apple" name="Apple Body" fill="#EF4444" d="M 250 140 C 140 130 120 380 250 420 C 380 380 360 130 250 140 Z" />
    <path id="leaf" name="Green Leaf" fill="#22C55E" d="M 250 130 C 310 80 310 130 250 130 Z" />
    <path id="stem" name="Stem" fill="#78350F" d="M 250 80 L 245 140 L 255 140 Z" />
  </g>
  <!-- Permanent Foreground Outlines -->
  <g id="outlines">
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 250 140 C 140 130 120 380 250 420 C 380 380 360 130 250 140 Z" />
  </g>
</svg>
