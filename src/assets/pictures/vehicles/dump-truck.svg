<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" data-title="Dump Truck" data-category="vehicles" data-accent="#F59E0B">
  <title>Dump Truck</title>
  <!-- Colorable Regions -->
  <g id="regions">
    <path id="bg" name="Construction Site" fill="#EFF6FF" d="M 10 10 L 490 10 L 490 490 L 10 490 Z" />
    <path id="cab" name="Truck Cab" fill="#EF4444" d="M 80 240 L 180 240 L 180 370 L 80 370 Z" />
    <path id="window" name="Cab Window" fill="#BAE6FD" d="M 100 255 L 160 255 L 160 305 L 100 305 Z" />
    <path id="bed" name="Yellow Dump Bed" fill="#FACC15" d="M 190 200 L 410 200 L 390 370 L 190 370 Z" />
    <path id="wheel_f" name="Front Wheel" fill="#1E293B" d="M 130 370 C 100 370 100 430 130 430 C 160 430 160 370 130 370 Z" />
    <path id="wheel_b1" name="Back Wheel 1" fill="#1E293B" d="M 270 370 C 240 370 240 430 270 430 C 300 430 300 370 270 370 Z" />
    <path id="wheel_b2" name="Back Wheel 2" fill="#1E293B" d="M 350 370 C 320 370 320 430 350 430 C 380 430 380 370 350 370 Z" />
  </g>
  <!-- Permanent Foreground Outlines -->
  <g id="outlines">
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 80 240 L 180 240 L 180 370 L 80 370 Z M 190 200 L 410 200 L 390 370 L 190 370 Z" />
  </g>
</svg>
