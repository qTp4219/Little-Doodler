<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" data-title="Helicopter" data-category="vehicles" data-accent="#10B981">
  <title>Helicopter</title>
  <!-- Colorable Regions -->
  <g id="regions">
    <path id="bg" name="High Sky" fill="#EFF6FF" d="M 10 10 L 490 10 L 490 490 L 10 490 Z" />
    <path id="body" name="Cabin Body" fill="#10B981" d="M 160 250 C 160 170 320 170 340 250 C 340 320 160 320 160 250 Z" />
    <path id="windshield" name="Front Glass" fill="#BAE6FD" d="M 170 240 C 170 190 230 190 230 250 Z" />
    <path id="tail" name="Tail Boom" fill="#059669" d="M 330 240 L 430 240 L 430 270 L 330 270 Z" />
    <path id="rotor_pole" name="Rotor Mast" fill="#1E293B" d="M 240 140 L 260 140 L 260 180 L 240 180 Z" />
    <path id="rotor_blade" name="Top Rotor Blade" fill="#334155" d="M 110 130 L 390 130 L 390 145 L 110 145 Z" />
    <path id="skid" name="Landing Skid" fill="#475569" d="M 180 360 L 320 360 L 320 375 L 180 375 Z" />
  </g>
  <!-- Permanent Foreground Outlines -->
  <g id="outlines">
    <path fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M 160 250 C 160 170 320 170 340 250 C 340 320 160 320 160 250 Z" />
    <path fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M 110 130 L 390 130 L 390 145 L 110 145 Z" />
  </g>
</svg>
